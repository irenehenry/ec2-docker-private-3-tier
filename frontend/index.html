<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3-Tier App</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 80px; }
    h1 { color: #2c3e50; }
  </style>
</head>
<body>
  <h1>Frontend is Working!</h1>
  <p>This is a simple 3-tier application running on EC2 + Docker Compose.</p>
  <p id="backend-status">Checking backend...</p>

  <script>
    fetch('/api/health')
      .then(res => res.json())
      .then(data => {
        document.getElementById('backend-status').innerText = 'Backend Status: ' + data.status;
      })
      .catch(err => {
        document.getElementById('backend-status').innerText = 'Backend not reachable';
      });
  </script>
</body>
</html>
