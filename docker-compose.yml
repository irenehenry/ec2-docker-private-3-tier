services:
  frontend:
    image: 325381792777.dkr.ecr.ap-south-1.amazonaws.com/frontend:latest
    ports:
      - "80:80"
    restart: always

  backend:
    image: 325381792777.dkr.ecr.ap-south-1.amazonaws.com/backend:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    restart: always